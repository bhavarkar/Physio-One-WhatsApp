# ==============================================================================
# Physio One WhatsApp AI Platform — Host Nginx Virtual Host Configuration
# Target: Hostinger Ubuntu Linux VPS (Coexists with n8n.dataagent.in)
# File Location on VPS: /etc/nginx/sites-available/physio.conf
# Enabled via: ln -s /etc/nginx/sites-available/physio.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Replace physio.dataagent.in with your chosen domain or subdomain
upstream physio_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream physio_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80)
# Handles Certbot ACME HTTP-01 challenges and redirects all other traffic to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name physio.dataagent.in;

    # Let's Encrypt / Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (Port 443)
# Reverse proxies Next.js frontend and FastAPI backend with TLS termination
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name physio.dataagent.in;

    # SSL Certificates managed by Certbot
    # (Uncomment after running: sudo certbot certonly --nginx -d physio.dataagent.in)
    ssl_certificate /etc/letsencrypt/live/physio.dataagent.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/physio.dataagent.in/privkey.pem;

    # Modern SSL Protocol & Cipher Suite
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PhysioSSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Request Body Size Limit (Supports WhatsApp voice notes, clinic PDFs, document uploads)
    client_max_body_size 15M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # Common Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # --------------------------------------------------------------------------
    # Route: FastAPI REST API & Webhooks
    # Directs all /api/ requests to the backend container (127.0.0.1:8000)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://physio_api;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # Route: Backend Health Check
    location = /health {
        proxy_pass http://physio_api/health;
        proxy_read_timeout 10s;
    }

    # Route: OpenAPI Documentation & Schemas
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://physio_api;
    }

    # --------------------------------------------------------------------------
    # Route: Next.js Frontend Dashboard UI
    # Directs all UI requests to Next.js container (127.0.0.1:3000)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://physio_frontend;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
